name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restauration (fichiers de verrouillage imposés)
        run: dotnet restore --locked-mode
      - name: Compilation
        run: dotnet build --no-restore -c Release
      - name: Tests
        shell: bash
        run: |
          set +e
          dotnet test --no-build -c Release --project tests/Cinedex.Tests 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Tests en échec remontés en annotation, lisibles sans ouvrir le journal complet.
            summary=$(grep -E -A8 '^\s*(failed|échec) ' test.log | head -80 | tr -d '' | sed ':a;N;$!ba;s/%/%25/g;s/
/%0A/g')
            echo "::error title=Tests en échec::${summary}"
          fi
          exit $status
      - name: Paquets vulnérables
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi
