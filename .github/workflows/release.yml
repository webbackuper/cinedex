name: Paquets

# Une étiquette vX.Y.Z publie la version sur GitHub :
# - programme d'installation et mises à jour automatiques (Velopack) pour Windows, Linux et macOS ;
# - archives portables par plate-forme, avec MediaInfo CLI embarqué (version et empreinte épinglées dans build/mediainfo.json).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  VPK_VERSION: "1.2.161"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, installer: true, channel: win }
          - { os: windows-latest, rid: win-arm64, installer: false, channel: "" }
          - { os: ubuntu-latest, rid: linux-x64, installer: true, channel: linux }
          - { os: ubuntu-latest, rid: linux-arm64, installer: false, channel: "" }
          - { os: macos-latest, rid: osx-arm64, installer: true, channel: osx }
          - { os: macos-latest, rid: osx-x64, installer: false, channel: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Tests
        if: matrix.installer
        run: dotnet test -c Release --project tests/Cinedex.Tests
      - name: Archive portable ${{ matrix.rid }}
        shell: pwsh
        run: ./build/package.ps1 -Rid ${{ matrix.rid }}
      - name: Outil Velopack
        if: matrix.installer
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
      - name: Version précédente (mises à jour différentielles)
        if: matrix.installer && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN --channel ${{ matrix.channel }} --outputDir releases
          if ($LASTEXITCODE -ne 0) { Write-Host "Pas de version précédente : paquet complet seulement." }
          exit 0
      - name: Programme d'installation ${{ matrix.rid }}
        if: matrix.installer
        shell: pwsh
        run: ./build/installer.ps1 -Rid ${{ matrix.rid }} -Output releases
      - uses: actions/upload-artifact@v5
        with:
          name: Cinedex-${{ matrix.rid }}
          path: |
            publish/Cinedex-*-${{ matrix.rid }}.zip
            publish/Cinedex-*-${{ matrix.rid }}.zip.sha256
            releases/
          if-no-files-found: ignore

  # Signature Authenticode des paquets Windows par la SignPath Foundation (gratuite pour les projets
  # libres). Ce travail reste inactif tant que la variable de dépôt SIGNPATH_ORGANIZATION_ID n'est pas
  # renseignée : sans elle, la publication reprend les paquets non signés, exactement comme avant.
  # Mise en service : voir CODE_SIGNING_POLICY.md et docs/signature-windows.md.
  signature:
    needs: package
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Cinedex-win-x64
          path: win-x64
      - name: Dépôt de l'artefact à signer
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: Cinedex-win-x64-a-signer
          path: win-x64
      - name: Demande de signature
        uses: signpath/github-action-submit-signing-request@v1.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signe
      - name: L'artefact Windows signé remplace l'original
        uses: actions/upload-artifact@v5
        with:
          name: Cinedex-win-x64
          path: signe
          overwrite: true

  publish:
    # La signature est volontairement sautée tant qu'elle n'est pas configurée ; sans « !cancelled() », une
    # dépendance sautée ferait sauter la publication aussi. Un échec de la signature, lui, arrête tout.
    needs: [package, signature]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.package.result == 'success' && needs.signature.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Outil Velopack
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Programmes d'installation et mises à jour
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for pair in win:win-x64 linux:linux-x64 osx:osx-arm64; do
            channel="${pair%%:*}"; rid="${pair##*:}"
            # Velopack refuse de fusionner avec ses propres fichiers deja presents sur la version
            # (« merging release files on GitHub is not supported ») : une relance apres un echec en
            # cours de route restait donc bloquee. On retire d'abord ce que cette passe va reecrire.
            for file in "artifacts/Cinedex-$rid/releases"/*; do
              gh release delete-asset "$tag" "$(basename "$file")" --yes 2>/dev/null || true
            done
            vpk upload github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --token "$GITHUB_TOKEN" \
              --outputDir "artifacts/Cinedex-$rid/releases" --channel "$channel" --tag "$tag" \
              --releaseName "Cinedex ${tag#v}" --merge --publish
          done
      - name: Archives portables
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/Cinedex-*.zip
            artifacts/**/Cinedex-*.zip.sha256
