name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restauration (fichiers de verrouillage imposés)
        run: dotnet restore --locked-mode
      - name: Compilation
        run: dotnet build --no-restore -c Release
      - name: Tests
        shell: bash
        run: |
          set +e
          dotnet test --no-build -c Release --project tests/Cinedex.Tests --no-ansi --no-progress 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Tests d'interface : vraies fenêtres rendues sans écran (Avalonia Headless + Skia), pilotées au clavier et à la souris.
          dotnet test --no-build -c Release --project tests/Cinedex.UiTests --no-ansi --no-progress 2>&1 | tee -a test.log
          ui=${PIPESTATUS[0]}
          if [ "$ui" -ne 0 ]; then status=$ui; fi
          if [ "$status" -ne 0 ]; then
            # Tests en échec remontés en annotation, lisibles sans ouvrir le journal complet.
            summary=$(grep -E -A8 '(failed|échec) ' test.log | head -80 | tr -d '\r' | awk '{ printf "%s%%0A", $0 }')
            if [ -z "$summary" ]; then summary=$(tail -40 test.log | tr -d '\r' | awk '{ printf "%s%%0A", $0 }'); fi
            echo "::error title=Tests en échec::${summary}"
          fi
          exit $status
      - name: Paquets vulnérables
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi
